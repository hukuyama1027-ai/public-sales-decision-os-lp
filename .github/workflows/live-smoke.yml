name: live-smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'src/**'
      - 'functions/**'
      - 'lib/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 25
      - name: Health and D1 schema
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 https://public-sales-decision-os-lp.pages.dev/api/health | tee /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('db') is True, d
          assert d.get('schema') == 'cr003', d
          print('health PASS', d)
          PY
      - name: Free app is live
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 https://public-sales-decision-os-lp.pages.dev/app/ | tee /tmp/app.html
          grep -q '公共案件を探す' /tmp/app.html
          grep -q '官公需情報ポータル' /tmp/app.html
          echo 'app PASS'
      - name: Real public opportunity search
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 4 --retry-all-errors --retry-delay 5 'https://public-sales-decision-os-lp.pages.dev/api/opportunities/search?q=AI&limit=5' | tee /tmp/search.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/search.json'))
          assert d.get('ok') is True, d
          assert d.get('source') == 'kkj', d
          items=d.get('items') or []
          assert len(items) > 0, d
          first=items[0]
          assert first.get('title'), first
          print('search PASS count=', len(items))
          print('sample title=', first.get('title'))
          print('organization=', first.get('organization_name'))
          print('source_url=', first.get('source_url'))
          PY
