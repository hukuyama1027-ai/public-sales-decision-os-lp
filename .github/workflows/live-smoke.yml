name: live-smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'src/**'
      - 'functions/**'
      - 'lib/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 30
      - name: Health and D1 schema
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 https://public-sales-decision-os-lp.pages.dev/api/health | tee /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('db') is True, d
          assert d.get('schema') == 'cr004', d
          assert d.get('version') == '0.1-cr004', d
          print('health/schema CR-004 PASS', d)
          PY
      - name: CR-004 free app is live
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 https://public-sales-decision-os-lp.pages.dev/app/ | tee /tmp/app.html
          grep -q '今日やること' /tmp/app.html
          grep -q 'あなたへのおすすめ案件' /tmp/app.html
          grep -q 'WATCH更新' /tmp/app.html
          grep -q '官公需情報ポータル' /tmp/app.html
          echo 'CR-004 app shell PASS'
      - name: Real public opportunity search
        run: |
          set -euo pipefail
          SID="live-smoke-${GITHUB_RUN_ID}"
          curl --fail --show-error --silent --retry 4 --retry-all-errors --retry-delay 5 -H "X-Session-Id: ${SID}" 'https://public-sales-decision-os-lp.pages.dev/api/opportunities/search?q=AI&limit=5' | tee /tmp/search.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/search.json'))
          assert d.get('ok') is True, d
          assert d.get('source') == 'kkj', d
          items=d.get('items') or []
          assert len(items) > 0, d
          assert items[0].get('title'), items[0]
          print('search PASS count=', len(items))
          print('sample title=', items[0].get('title'))
          PY
