name: evidence-export
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/evidence-export.yml'
      - 'functions/api/internal/evidence.js'
      - 'lib/evidence.js'
      - 'lib/github-oidc.js'
      - 'lib/schema.js'
permissions:
  contents: read
  id-token: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch sanitized M3 evidence
        env:
          EVIDENCE_URL: https://public-sales-decision-os-lp.pages.dev/api/internal/evidence?days=30
          OIDC_AUDIENCE: aimos-public-sales-evidence
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          oidc_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep = '&' if '?' in oidc_url else '?'
          req = urllib.request.Request(
              oidc_url + sep + urllib.parse.urlencode({'audience': os.environ['OIDC_AUDIENCE']}),
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req, timeout=15) as r:
              token = json.load(r)['value']

          config_path = '/tmp/aimos-evidence-curl.conf'
          with open(config_path, 'w', encoding='utf-8') as f:
              f.write('silent\nshow-error\nfail-with-body\n')
              f.write('connect-timeout = 15\nmax-time = 30\n')
              f.write('user-agent = "GitHub-Actions-Evidence-Export/1.0"\n')
              f.write('header = "Accept: application/json"\n')
              f.write('header = "Authorization: Bearer ' + token + '"\n')
              f.write('url = "' + os.environ['EVIDENCE_URL'] + '"\n')
          os.chmod(config_path, 0o600)
          try:
              result = subprocess.run(['curl', '--config', config_path, '--output', 'evidence.json'], check=False)
          finally:
              os.remove(config_path)
          if result.returncode != 0:
              try:
                  print('Evidence endpoint response:', open('evidence.json', encoding='utf-8').read()[:500])
              except Exception:
                  pass
              raise SystemExit('evidence curl failed')

          with open('evidence.json', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('ok') is not True:
              raise SystemExit('evidence endpoint returned non-ok response')
          forbidden = {'client_key','session_id','company_name','email','services','keyword'}
          def walk(v):
              if isinstance(v, dict):
                  if forbidden.intersection(v.keys()):
                      raise SystemExit('forbidden raw field detected')
                  for x in v.values(): walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)
          walk(data)
          with open('evidence.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          print('sanitized M3 evidence fetched successfully')
          PY
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3-evidence-${{ github.run_id }}
          path: evidence.json
          retention-days: 30
          if-no-files-found: error
